# Source of truth for AriadShift.xcodeproj (generated by `just macos-project`, gitignored).
name: AriadShift
options:
  bundleIdPrefix: com.ariadnev
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "arm64 x86_64"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # EdDSA public key that verifies Sparkle updates. Empty in dev builds, which turns the
    # updater off; the release build passes the real key (SPARKLE_PUBLIC_ED_KEY=...).
    SPARKLE_PUBLIC_ED_KEY: ""
packages:
  AriadShiftCore:
    path: AriadShiftCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  AriadShift:
    type: application
    platform: macOS
    sources:
      - AriadShift
    dependencies:
      - package: AriadShiftCore
      - package: Sparkle
    info:
      path: AriadShift/Info.plist
      properties:
        CFBundleDisplayName: AriadShift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        SUFeedURL: https://github.com/bavanchun/AriadShift/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariadnev.ariadshift
        PRODUCT_NAME: AriadShift
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Embed ashift helper
        script: '"${SRCROOT}/scripts/embed-helper.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-helper.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ashift
  AriadShiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AriadShiftTests
    dependencies:
      - target: AriadShift
      - package: AriadShiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariadnev.ariadshift.tests
        GENERATE_INFOPLIST_FILE: YES
  AriadShiftUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - AriadShiftUITests
    dependencies:
      - target: AriadShift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariadnev.ariadshift.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AriadShift
        # The runner and the ad-hoc signed test bundle have different Team IDs; library validation would refuse the bundle.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  AriadShift:
    build:
      targets:
        AriadShift: all
        AriadShiftTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The menu tests read English titles; pin the language so a Vietnamese Mac does not fail them.
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
      targets:
        - AriadShiftTests
    archive:
      config: Release
  # UI tests drive the built app through the accessibility APIs, which needs Automation Mode and an
  # unlocked screen, so they run from their own scheme and the unit scheme stays headless-friendly.
  AriadShiftUI:
    build:
      targets:
        AriadShift: all
        AriadShiftUITests: [test]
    test:
      config: Debug
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
      targets:
        - AriadShiftUITests
