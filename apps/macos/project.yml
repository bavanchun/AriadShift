# Source of truth for AriadShift.xcodeproj (generated by `just macos-project`, gitignored).
name: AriadShift
options:
  bundleIdPrefix: com.ariadnev
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "arm64 x86_64"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AriadShiftCore:
    path: AriadShiftCore
targets:
  AriadShift:
    type: application
    platform: macOS
    sources:
      - AriadShift
    dependencies:
      - package: AriadShiftCore
    info:
      path: AriadShift/Info.plist
      properties:
        CFBundleDisplayName: AriadShift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariadnev.ariadshift
        PRODUCT_NAME: AriadShift
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Embed ashift helper
        script: '"${SRCROOT}/scripts/embed-helper.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-helper.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ashift
  AriadShiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AriadShiftTests
    dependencies:
      - target: AriadShift
      - package: AriadShiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariadnev.ariadshift.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AriadShift:
    build:
      targets:
        AriadShift: all
        AriadShiftTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AriadShiftTests
    archive:
      config: Release
