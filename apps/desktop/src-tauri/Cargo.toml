[package]
name = "ariad-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "ariad-desktop"

[lib]
name = "ariad_desktop"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ariad-core.workspace = true
ariad-host = { workspace = true, features = ["pdf", "typst"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
ts-rs.workspace = true
tempfile.workspace = true
url = "2.5.8"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-opener = "2.7.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.dist]
dist = false

[lints]
workspace = true
