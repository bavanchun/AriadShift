# Locale metadata for the web and macOS apps; see docs/i18n.md. The review status and the
# text direction live here, not in the translation files. `name` is the native name shown in
# the language picker. A community locale with dir = "rtl" stays out of the picker until a
# native reader has seen the main screens rendered right to left and sets rtl_checked = true.

[locale.en]
name = "English"
dir = "ltr"
status = "source"

[locale."en-GB"]
name = "English (UK)"
dir = "ltr"
status = "community"
# Only the keys whose British spelling differs; everything else falls back to en.
overlay = true

