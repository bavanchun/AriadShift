[package]
name = "ariad-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host engine orchestration and sandboxed document conversion pipeline for AriadShift"
readme = "../../README.md"
keywords = ["document-conversion", "pandoc", "sandboxing", "markdown", "epub"]
categories = ["text-processing", "command-line-utilities"]
publish = true
build = "build.rs"

[dependencies]
ariad-core.workspace = true
base64.workspace = true
cap-std.workspace = true
directories.workspace = true
flate2.workspace = true
hex.workspace = true
jiff.workspace = true
minisign-verify.workspace = true
process-wrap = { workspace = true, features = ["std"] }
quick-xml.workspace = true
ruzstd.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_stacker.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
toml.workspace = true
unicode-normalization.workspace = true
uuid = { workspace = true, features = ["v4", "v5"] }
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["signal"] }

# The host never targets wasm32; the HTTP client is native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls.workspace = true
rustls-native-certs.workspace = true
ureq.workspace = true

[dev-dependencies]
jsonschema.workspace = true
minisign.workspace = true
rcgen.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
nix = { workspace = true, features = ["resource"] }
seccompiler.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo = { workspace = true, features = ["system"] }

[features]
test-probe = []

[[bin]]
name = "engine-probe"
path = "src/bin/engine-probe.rs"
required-features = ["test-probe"]
test = false
bench = false

[package.metadata.dist]
dist = false

[lints]
workspace = true
