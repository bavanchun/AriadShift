[package]
name = "ariad-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core document intermediate representation and deterministic AST types for AriadShift"
readme = "../../README.md"
keywords = ["document-conversion", "markdown", "docx", "epub", "ast"]
categories = ["text-processing", "parser-implementations"]
publish = true

[dependencies]
ammonia.workspace = true
base64.workspace = true
comrak.workspace = true
encoding_rs.workspace = true
hex.workspace = true
html5ever.workspace = true
lopdf = { workspace = true, optional = true }
quick-xml.workspace = true
zip.workspace = true
schemars.workspace = true
sha2.workspace = true
saphyr-parser.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

# getrandom, which lopdf needs, compiles for browsers only through its wasm_js backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
lopdf = { workspace = true, optional = true, features = ["wasm_js"] }

[features]
default = ["pdf"]
# PDF text-layer reader built on lopdf.
pdf = ["dep:lopdf"]

[dev-dependencies]
insta.workspace = true
jsonschema = { workspace = true, default-features = false }
toml.workspace = true

[lints]
workspace = true
