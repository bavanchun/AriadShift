[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cache-builds = false
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Allow generated CI scripts to be out of date / manually edited
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Homebrew tap repository
tap = "bavanchun/homebrew-tap"
# Homebrew formula name
formula = "ashift"
# Publish jobs to run on release
publish-jobs = ["homebrew", "./publish-crates"]
# PR run mode: build and upload artifacts on PR without publishing
pr-run-mode = "upload"
# Include third-party notices and licenses in archive bundles
include = ["NOTICE", "THIRD_PARTY_LICENSES"]
# Embed dependency information in executable via cargo-auditable
cargo-auditable = true
# Generate CycloneDX SBOM
cargo-cyclonedx = true

[dist.dependencies.homebrew]
pandoc = { stage = ["run"] }

[dist.github-custom-runners]
"aarch64-apple-darwin" = "macos-26"
"x86_64-apple-darwin" = "macos-26"
"x86_64-unknown-linux-musl" = "ubuntu-26.04"
"aarch64-unknown-linux-musl" = "ubuntu-26.04-arm"
"x86_64-pc-windows-msvc" = "windows-2025"
global = "ubuntu-26.04"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"

