[project]
name = "ariad-fixture-gen"
version = "0.0.0"
description = "Deterministic document fixtures for AriadShift"
requires-python = ">=3.14"
dependencies = [
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pillow==13.0.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "typst==0.15.0",
]
classifiers = [
    "Private :: Do Not Upload",
]

# Dev/test-only PDF structure/encryption/form generator dependency (MPL-2.0); never distributed.
[dependency-groups]
dev = [
    "pikepdf==10.17.0",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"
