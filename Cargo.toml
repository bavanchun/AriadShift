[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/bavanchun/AriadShift"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.2"
axum = "0.8"
base64 = "0.23.1"
cap-std = "4.0.3"
cargo-dist = "0.32"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.55.0", default-features = false, features = ["shortcodes"] }
hex = "0.4.3"
insta = { version = "1.49.0", features = ["json", "glob"] }
jiff = "0.2"
jsonwebtoken = "11"
jsonschema = "0.58.5"
object_store = "0.14"
opentelemetry = "0.33"
pdfium-render = "0.9"
process-wrap = { version = "10.0.1", features = ["tokio1", "process-group", "job-object"] }
quick-xml = "0.42.0"
rmcp = "3.5"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
serde_stacker = "0.1.14"
sha2 = "0.11.0"
sqlx = "0.9"
tauri-specta = "1.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "~1.53" }
tokio-util = "0.7.19"
toml = "1.1.6+spec-1.1.0"
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
typst = "0.15"
unicode-normalization = "0.1.25"
utoipa = "6"
uuid = "1"
wasm-bindgen = "0.2"
wasm-pack = "0.15"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
