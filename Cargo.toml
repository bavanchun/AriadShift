[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["fuzz", "vendor/tauri-plugin-deep-link"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/bavanchun/AriadShift"
publish = false

[workspace.dependencies]
ammonia = "4.2.1"
ariad-core = { path = "crates/ariad-core", version = "0.2.0", default-features = false }
ariad-typst = { path = "crates/ariad-typst", version = "0.2.0" }
ariad-host = { path = "crates/ariad-host", version = "0.2.0", default-features = false }
assert_cmd = "2.2.2"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
cap-std = "4.0.3"
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.56.0", default-features = false, features = ["shortcodes"] }
directories = "6.0.0"
encoding_rs = "0.8.42"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
hmac = "0.13.0"
html5ever = "0.40.1"
insta = { version = "1.49.0", features = ["json", "glob"] }
jiff = "0.2"
js-sys = "0.3.106"
landlock = "0.4.7"
jsonschema = { version = "0.59.0", default-features = false, features = ["resolve-file", "idna"] }
jsonwebtoken = { version = "11.1.0", default-features = false }
libc = "0.2"
lopdf = { version = "0.46.0", default-features = false }
minisign = "0.10.0"
minisign-verify = "0.3.0"
nix = { version = "0.31.3", default-features = false }
object_store = { version = "0.14.2", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false }
process-wrap = { version = "10.0.1", features = ["tokio1", "process-group", "job-object"] }
quick-xml = "0.42.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "3.5.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
ruzstd = "0.9.1"
saphyr-parser = "0.2.2"
schemars = "1.2.2"
semver = "1.0.28"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["unbounded_depth", "float_roundtrip"] }
serde_stacker = "0.1.14"
seccompiler = "0.5.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
sysinfo = { version = "0.39.6", default-features = false }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "~1.53" }
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = "0.7.19"
toml = "1.1.6"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
typst = "0.15.1"
typst-pdf = "0.15.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }
url = "2.5.8"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = "1"
wasm-bindgen = "0.2.129"
windows-sys = "0.61.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = "debuginfo"

# Hashing runs over large engine pack components in tests; unoptimized SHA-256 is too slow.
[profile.dev.package.sha2]
opt-level = 3

# Size-optimized build of the browser module.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[patch.crates-io]
tauri-plugin-deep-link = { path = "vendor/tauri-plugin-deep-link" }
