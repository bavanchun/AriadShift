[default]
locale = "en"

[default.extend-words]
# Correct names and acronyms in the public planning and research files.
Ba = "Ba"
Nam = "Nam"
OER = "OER"
# EPUB package document (content.opf) and the Python CA bundle package.
opf = "opf"
certifi = "certifi"
# OpenDocument Format and the flate2 compression crate.
ODF = "ODF"
flate = "flate"
# Tesseract's language data name for Thai.
tha = "tha"

[default.extend-identifiers]
# Plural of PNG; without this the case split reads it as "PN" + "Gs".
PNGs = "PNGs"
# Linux procfs names this field for inheritable process capabilities.
CapInh = "CapInh"

[files]
extend-exclude = [
    "THIRD_PARTY_LICENSES",
    "fixtures/md/vi-*.md",
    "fixtures/md/mixed-*.md",
    "fixtures/gen/src/ariad_fixture_gen/text/vietnamese-*.md",
    "fixtures/golden/*.snap",
    "fixtures/**/*.truth.json",
    # Engine output with JSON-escaped non-ASCII text, which the checker splits into fragments.
    "fixtures/docling/*.docling.json",
    "fuzz/seeds/**",
]
