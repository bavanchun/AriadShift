[default]
locale = "en"
# Abbreviated Git commit hash referenced in review reports.
extend-ignore-re = ["\\bc234afe\\b", 'b"ND"']

[default.extend-words]
# Correct names and acronyms in the public planning and research files.
Ba = "Ba"
Nam = "Nam"
OER = "OER"
HSI = "HSI"
# EPUB package document (content.opf) and the Python CA bundle package.
opf = "opf"
certifi = "certifi"
# macOS wheel shared-library bundler paired with auditwheel and delvewheel.
delocate = "delocate"
# OpenDocument Format and the flate2 compression crate.
ODF = "ODF"
flate = "flate"
# Tesseract's language data name for Thai.
tha = "tha"
# XML Formatting Objects namespace used by OpenDocument styles.
fo = "fo"
# PNG predictor name and the French proper name in qpdf's upstream notice.
paeth = "paeth"
Projet = "Projet"
# TrueType glyph location table.
loca = "loca"
# IzPack installer framework used by veraPDF release installer.
IzPack = "IzPack"
Iz = "Iz"
# Vietnamese accent-folded compression-level keyword in the NL recipe parser.
muc = "muc"

[default.extend-identifiers]
# Plural of PNG; without this the case split reads it as "PN" + "Gs".
PNGs = "PNGs"
# Linux procfs names this field for inheritable process capabilities.
CapInh = "CapInh"
# PDF 1.7 / ISO 32000-1 stream dictionary keys for filter decode parameters.
DecodeParms = "DecodeParms"
FDecodeParms = "FDecodeParms"

[files]
extend-exclude = [
    "THIRD_PARTY_LICENSES",
    "apps/desktop/THIRD_PARTY_JS_LICENSES",
    "vendor/**",
    # Full upstream notices; the pack checks their reviewed SHA-256 digests.
    "engines/docling/pack/licenses/*-notice*.txt",
    "engines/verapdf/pack/notices/*",
    "engines/ai/pack/notices/*",
    "engines/inpaint/pack/notices/*",
    "fixtures/md/vi-*.md",
    "fixtures/md/mixed-*.md",
    "fixtures/gen/src/ariad_fixture_gen/text/vietnamese-*.md",
    "fixtures/golden/*.snap",
    # Generated snapshots preserve multilingual text and hashed identities.
    "fixtures/golden/v2/*.snap",
    "fixtures/**/*.truth.json",
    # Engine output with JSON-escaped non-ASCII text, which the checker splits into fragments.
    "fixtures/docling/*.docling.json",
    "fuzz/seeds/**",
    # Translations of the English catalogue; only locales/en.json is English prose.
    "locales/[!e]*.json",
    "locales/e[!n]*.json",
    "locales/en-*.json",
]

# Original wheel RECORD receipts contain URL-safe SHA-256 digests.
[type.wheel-record]
extend-glob = ["*.record"]
extend-ignore-re = ["sha256=[A-Za-z0-9_-]+"]
