  "@base-ui/react": 1.9.0
  "@formatjs/icu-messageformat-parser": 3.5.23
  "@better-auth/api-key": 1.7.16
  "@better-auth/oauth-provider": 1.7.16
  "@better-auth/passkey": 1.7.16
  "@biomejs/biome": 2.6.4
  "@fontsource-variable/plus-jakarta-sans": 5.3.0
  "@fontsource/plus-jakarta-sans": 5.3.0
  "@hey-api/openapi-ts": 0.99.0
  "@hono/node-server": 2.1.6
  "@playwright/test": 1.64.1
  "@resvg/resvg-js": 2.6.2
  "@tailwindcss/postcss": 4.3.4
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  better-auth: 1.7.16
  chrome-launcher: 1.2.2
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  hono: 4.13.16
  jsdom: 30.1.3
  lighthouse: 13.6.0
  lucide-react: 1.67.0
  next: 16.4.5
  next-intl: 4.14.9
  "opentype.js": 2.0.0
  pg: 8.23.1
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.23.0
  svgo: 4.1.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.4
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vitest: 5.1.0

# next-intl pulls these in for its message extractor, which is not used; their install
# scripts only fetch optional native binaries and stay disabled.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false

# EmbedPDF declares vue, svelte and preact as required peers although each package only
# uses the one framework adapter it is imported through. This app uses React, so the other
# three stay uninstalled (otherwise pnpm adds the svelte tree and breaks the notice gate).
packageExtensions:
  "@embedpdf/core":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/engines":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/utils":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-document-manager":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-interaction-manager":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-render":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-scroll":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-search":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-selection":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-thumbnail":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-viewport":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }
  "@embedpdf/plugin-zoom":
    peerDependenciesMeta:
      vue: { optional: true }
      svelte: { optional: true }
      preact: { optional: true }

# @embedpdf/engines hard-depends on seven OFL-1.1 font packages that the browser build never
# loads (fonts are fetched only when configured). Removing them keeps OFL-1.1 limited to
# Plus Jakarta Sans, as AGENTS.md allows.
overrides:
  "@embedpdf/fonts-arabic": "-"
  "@embedpdf/fonts-hebrew": "-"
  "@embedpdf/fonts-jp": "-"
  "@embedpdf/fonts-kr": "-"
  "@embedpdf/fonts-latin": "-"
  "@embedpdf/fonts-sc": "-"
  "@embedpdf/fonts-tc": "-"
