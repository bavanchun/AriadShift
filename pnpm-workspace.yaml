# Patched transitive versions for advisories whose parents still pin the
# vulnerable release. Both reach only development tooling: js-yaml through
# the @hey-api/openapi-ts SDK generator, body-parser through the
# @modelcontextprotocol/sdk server bundled with the shadcn CLI. Drop each
# entry once its parent resolves the fixed version on its own.
overrides:
  # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  # GHSA-27r3-jxmh-p828
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
