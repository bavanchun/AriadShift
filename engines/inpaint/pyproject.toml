[project]
name = "ariad-inpaint"
version = "0.1.0"
description = "Offline inpaint engine speaking ariad-engine/2"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0 AND MIT"
dependencies = ["pypdf==7.0.0"]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
