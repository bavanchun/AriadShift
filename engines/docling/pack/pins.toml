#     { name = "torch-2.14.1+cpu-cp314-cp314-manylinux_2_28_x86_64.whl", url = "https://github.com/bavanchun/AriadShift/releases/download/toolchain-wheels-v0.2.0/torch-2.14.1+cpu-cp314-cp314-manylinux_2_28_x86_64.whl", sha256 = "<64-hex>", size = 0 },
