# Only an explicit reviewed declaration for an exact pack tag can omit macOS.
# No omission is approved here. Manual runs use their explicit workflow input.
# Example after approval: "pack-docling-vX.Y.Z" = ["aarch64-apple-darwin"]
[pack_release_skips]

