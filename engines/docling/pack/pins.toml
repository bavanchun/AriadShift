# ]

[toolchain.targets.aarch64-unknown-linux-gnu]

[toolchain.targets.aarch64-apple-darwin]

[toolchain.targets.x86_64-pc-windows-msvc]
# Populated after cutting `toolchain-wheels-v0.2.0`:
# [toolchain.targets.x86_64-pc-windows-msvc.opencv]
# build_key = "<64-hex>"
# files = [
#     { name = "opencv_python_headless-5.0.0.93-cp314-cp314-win_amd64.whl", url = "https://github.com/bavanchun/AriadShift/releases/download/toolchain-wheels-v0.2.0/opencv_python_headless-5.0.0.93-cp314-cp314-win_amd64.whl", sha256 = "<64-hex>", size = 0 },
