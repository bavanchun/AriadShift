[toolchain]
# Pre-built MKL-free / IPP-free / ittapi-free native wheels and OpenMP/licence sidecars
# built by `.github/workflows/toolchain-wheels.yml` and published on this repository's
# GitHub Releases (`toolchain-wheels-v*`).
#
# While `[toolchain.targets.<triple>.<kind>]` (`kind` in `opencv`, `torch`) is omitted
# during bootstrap (before the first `toolchain-wheels-v*` release is cut),
# `native_build.release_files()` returns `None` and builds from the pinned sources above.
# Once a `toolchain-wheels-v*` release is published, render the `build_key` and `files`
# entries from the downloaded `toolchain-wheels-*` artifacts and paste them below:
#   uv run --no-project --python 3.14 python engines/docling/pack/licenses.py \
#     --render-toolchain-pins DIR --release-tag toolchain-wheels-v0.2.0
release = "toolchain-wheels-v0.2.0"
source = "https://github.com/bavanchun/AriadShift/releases/tag/toolchain-wheels-v0.2.0"

[toolchain.targets.x86_64-unknown-linux-gnu]
# Populated after cutting `toolchain-wheels-v0.2.0`:
# [toolchain.targets.x86_64-unknown-linux-gnu.opencv]
