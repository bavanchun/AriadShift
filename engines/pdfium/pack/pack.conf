# Pack-level settings read by engines/pdfium/pack/make.sh (POSIX sh syntax, no commands).
PACK_NAME=pdfium
# Packs are versioned 0.x and unstable until ariad-engine/2 is final.
PACK_VERSION=0.1.0
PACK_DESCRIPTION='PDFium rendering, text geometry and image engine'
# Everything the pack carries: the engine (Apache-2.0), PDFium and the libraries it bundles, and
# the pdfium-binaries wrapper (MIT). Matches the files under notices/.
PACK_LICENSE='Apache-2.0 AND BSD-3-Clause AND BSD-2-Clause AND MIT AND FTL AND IJG AND Zlib AND libpng-2.0 AND Unicode-3.0 AND BSL-1.0 AND Apache-2.0 WITH LLVM-exception'
# Lower bound: the first ashift that reads the engine_protocol field. Raise it to the release
# number when that release is cut; override per run with PACK_REQUIRES_ASHIFT.
PACK_REQUIRES_ASHIFT='>=0.2.0, <2.0.0'
PACK_ENGINE_PROTOCOL=ariad-engine/2
PACK_ENGINE_BIN=ariad-pdfium-engine
# Upstream release that the SHA-256 table in targets.txt pins.
PDFIUM_RELEASE_BASE=https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125
