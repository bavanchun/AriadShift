# Weekly update pull requests into dev. Each ecosystem gets one grouped pull
# request holding every update, so a week costs one CI run per ecosystem. Open
# pull requests are never rebased automatically: a rebase after each merge to
# dev restarted the heavy workflows for every open pull request. Rebase one by
# hand (comment "@dependabot rebase") when it is about to merge. A release must
# be seven days old before it is proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Saigon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
    rebase-strategy: disabled
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Saigon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ['*']
    rebase-strategy: disabled
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /fuzz
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Saigon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ['*']
    rebase-strategy: disabled
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Saigon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ['*']
    rebase-strategy: disabled
    open-pull-requests-limit: 2

  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Saigon
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      uv:
        patterns: ['*']
    rebase-strategy: disabled
    open-pull-requests-limit: 2
