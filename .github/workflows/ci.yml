name: CI

# Event rules and the reasoning behind them: docs/ci.md.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on dev and main are
# grouped by commit, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      range: ${{ steps.scope.outputs.range }}
      heavy: ${{ steps.scope.outputs.heavy }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-scope.sh

  static:
    name: Static checks
    needs: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false

      - name: Install command-line tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,typos@1.50.3,cargo-about@0.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Install lint tools
        run: just lint-tools

      - name: Check commit messages
        if: needs.scope.outputs.range != ''
        env:
          RANGE: ${{ needs.scope.outputs.range }}
        run: just lint-commits "$RANGE"

      - name: Run static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: just static

  lint-windows:
    name: Lint (windows-2025)
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features ariad-host/test-probe

  verify:
    name: Verify (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Install command-line tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Cache Pandoc archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: pandoc-${{ runner.os }}-${{ hashFiles('scripts/install-pandoc.sh') }}

      - name: Install Pandoc
        run: just pandoc

      - name: Set native Pandoc path
        run: |
          pandoc_path="${GITHUB_WORKSPACE}/.tools/pandoc/bin/pandoc"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pandoc_path="$(cygpath -m "${pandoc_path}.exe")"
          fi
          printf 'ASHIFT_PANDOC=%s\n' "$pandoc_path" >> "$GITHUB_ENV"

      - name: Verify Pandoc installation
        run: '"$ASHIFT_PANDOC" --version'

      # The Windows lint job already runs Clippy there.
      - name: Run Clippy
        if: runner.os != 'Windows'
        run: just clippy

      # ariad-core must stay WASM-safe; the check does not depend on the host OS.
      - name: Check the WASM build
        if: runner.os == 'Linux'
        run: just wasm

      - name: Run tests
        run: just test

      - name: Run benchmark harness tests
        run: just bench-test

      - name: Check capabilities registry
        run: just bench-check

      - name: Check packaging
        run: just package-check

  fuzz:
    name: Fuzz
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Restore cargo-fuzz binary
        id: restore-cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi

      - name: Save cargo-fuzz binary
        if: github.event_name == 'push' && steps.restore-cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Restore fuzz target cache
        id: restore-fuzz-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: fuzz-target-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            fuzz-target-${{ runner.os }}-

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Run fuzz targets
        run: |
          targets="markdown_reader front_matter html_reader pandoc_ast_to_ir ir_json limits_validate"
          for t in $targets; do
            echo "=== Running fuzz target: $t ==="
            mkdir -p "fuzz/corpus/$t"
            cargo fuzz run -s none "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done

      - name: Save fuzz target cache
        if: github.event_name == 'push' && steps.restore-fuzz-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: fuzz-target-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save fuzz corpus
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}

      - name: Upload crash artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14

  web:
    name: Web
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Install command-line tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: just js

      # Builds the wasm module, then typechecks, runs Vitest and builds the site.
      - name: Typecheck, unit tests and production build
        run: just web-ci

      - name: Restore Playwright browsers
        id: restore-playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Use the primary Ubuntu archive for browser libraries
        run: |
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done

      - name: Install Playwright browsers and their system packages
        run: just web-browsers --with-deps

      - name: Save Playwright browsers
        if: github.event_name == 'push' && steps.restore-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run end-to-end tests on Chromium, Firefox and WebKit
        run: just web-e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 14

  ci-passed:
    name: CI passed
    needs: [scope, static, lint-windows, verify, fuzz, web]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          HEAVY: ${{ needs.scope.outputs.heavy }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static.result }}
          WINDOWS: ${{ needs.lint-windows.result }}
          VERIFY: ${{ needs.verify.result }}
          FUZZ: ${{ needs.fuzz.result }}
          WEB: ${{ needs.web.result }}
        run: |
          printf 'scope=%s static=%s lint-windows=%s verify=%s fuzz=%s web=%s heavy=%s web-scope=%s\n' \
            "$SCOPE" "$STATIC" "$WINDOWS" "$VERIFY" "$FUZZ" "$WEB" "$HEAVY" "$WEB_SCOPE"
          [ "$SCOPE" = success ] && [ "$STATIC" = success ] || exit 1
          if [ "$HEAVY" = true ]; then
            [ "$WINDOWS" = success ] && [ "$VERIFY" = success ] && [ "$FUZZ" = success ] || exit 1
          else
            [ "$WINDOWS" = skipped ] && [ "$VERIFY" = skipped ] && [ "$FUZZ" = skipped ] || exit 1
          fi
          if [ "$WEB_SCOPE" = true ]; then
            [ "$WEB" = success ] || exit 1
          else
            [ "$WEB" = skipped ] || exit 1
          fi
