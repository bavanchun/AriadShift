name: CI

# Event rules and the reasoning behind them: docs/ci.md.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on dev and main are
# grouped by commit, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Typst and packaging create large artifacts; CI does not need local debug/incremental data.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      range: ${{ steps.scope.outputs.range }}
      heavy: ${{ steps.scope.outputs.heavy }}
      web: ${{ steps.scope.outputs.web }}
      package: ${{ steps.scope.outputs.package }}
      linux_parts: ${{ steps.scope.outputs.linux_parts }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-scope.sh

  static:
    name: Static checks
    needs: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
          cache: false

      - name: Install command-line tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,typos@1.50.3,cargo-about@0.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.9.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Install lint tools
        run: just lint-tools

      - name: Check commit messages
        if: needs.scope.outputs.range != ''
        env:
          RANGE: ${{ needs.scope.outputs.range }}
        run: just lint-commits "$RANGE"

      - name: Check PDF codec feature variants
        run: |
          cargo check --locked -p ariad-pdf --no-default-features
          cargo check --locked -p ariad-pdf --no-default-features --features codecs

      - name: Run static checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: just static

  lint-windows:
    name: Lint (windows-2025)
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
          cache: false

      # Every cache of this file comes from Swatinem/rust-cache used directly, not through
      # setup-rust-toolchain (cache: false there). The wrapper keeps the action's default of hashing
      # the Rust versions of every toolchain installed on the runner into the key, which includes the
      # image's preinstalled stable: two jobs of one run on different runner images got different keys
      # and missed each other's caches, and every image update stored another copy of each entry.
      # add-rust-environment-hash-key: false drops that hash, but the action then also drops the hash
      # of Cargo.lock, the manifests and rust-toolchain.toml from the key (a constant key would give an
      # exact hit forever and the cache would never be saved again). So the same hash is passed in
      # `key` below: the key is the OS, the job, that hash and no runner-image detail. A lockfile or
      # toolchain change starts a cold cache; there is no partial restore across such a change.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features ariad-host/test-probe

  # The macOS and Windows half of Verify. Linux has its own job below, split into parallel parts.
  verify:
    name: Verify (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    # Cold builds on macOS and Windows can exceed 30 min before cache warming (e.g. after a prefix bump or prune); 45 min prevents spurious cancellation.
    timeout-minutes: ${{ matrix.timeout }}
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'ci-cache-write' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            timeout: 45
          - os: windows-2025
            timeout: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Install command-line tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146,sccache@0.19.0

      - name: Start sccache (read-write)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_WRITE
        run: bash scripts/ci-sccache.sh start

      - name: Start sccache (read-only)
        if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) }}
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_ONLY
        run: bash scripts/ci-sccache.sh start

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Cache Pandoc archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: pandoc-${{ runner.os }}-${{ hashFiles('scripts/install-pandoc.sh') }}

      - name: Install Pandoc
        run: just pandoc

      - name: Set native Pandoc path
        run: |
          pandoc_path="${GITHUB_WORKSPACE}/.tools/pandoc/bin/pandoc"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pandoc_path="$(cygpath -m "${pandoc_path}.exe")"
          fi
          printf 'ASHIFT_PANDOC=%s\n' "$pandoc_path" >> "$GITHUB_ENV"

      - name: Verify Pandoc installation
        run: '"$ASHIFT_PANDOC" --version'

      # The Windows lint job already runs Clippy there.
      - name: Run Clippy
        if: runner.os != 'Windows'
        run: just clippy

      - name: Run tests
        run: just test

      - name: Check the CLI without default features
        run: cargo check -p ariad-cli --no-default-features

      - name: Run benchmark harness tests
        run: just bench-test

      - name: Check capabilities registry
        run: just bench-check

      # Packaging is the same on every host, and on macOS it recompiles the dependency graph from
      # cold (6 to 14 minutes there, 3 to 5 on Linux and Windows), which pushed cold macOS runs past
      # the timeout and kept the macOS cache from ever being saved. Linux runs it in its own part
      # (verify-linux); on a pull request the scope job asks for it only when a change can affect it.
      - name: Check packaging
        if: runner.os != 'macOS' && needs.scope.outputs.package == 'true'
        run: just package-check

      - name: Stop sccache and report stats
        if: always()
        env:
          JOB_NAME: Verify (${{ matrix.os }})
        run: bash scripts/ci-sccache.sh stop

  # The Linux half of Verify. One job with four parts, so that each step is written once. The scope
  # job lists the parts (linux_parts in scripts/ci-scope.sh) and they run in parallel, which makes
  # the wall time the slowest part and not the sum. What each part runs: docs/ci.md.
  #   lint     Clippy, the WASM check, the slim CLI check, the capabilities registry
  #   test-N   one nextest shard each; the last also runs the doc tests, the first the benchmark
  #            harness tests (they drive the ashift binary that the test compile leaves behind)
  #   package  `cargo package` verification; present only when the scope asks for it
  verify-linux:
    name: Verify (ubuntu-26.04, ${{ matrix.part }})
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    # A warm part takes 5 to 10 minutes. Every test shard compiles the whole test graph (the
    # partition splits only the execution of the tests), about 4.5 minutes warm and much more
    # with a cold Rust cache, and the apt steps may use up to 25 minutes on a bad mirror day
    # (5 + 12 + 8), so the limit leaves room for a cold compile on top of them.
    timeout-minutes: 35
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'ci-cache-write' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.linux_parts) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the test shards keep a target cache: they share the entry `test` (same test profile)
      # and only the first shard saves it. The lint and package parts have none: the repository's
      # 10 GB Actions cache budget is full and sccache already holds their compile units. As
      # elsewhere, only a push saves. The cache step is Swatinem/rust-cache used directly, with the
      # test shards sharing the key prefix `test-` (see the note at the first use in this file).
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Cache Rust artifacts
        if: startsWith(matrix.part, 'test-')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          add-rust-environment-hash-key: false
          key: test-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' && matrix.part != 'test-2' }}

      - name: Install command-line tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146,sccache@0.19.0

      - name: Start sccache (read-write)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_WRITE
        run: bash scripts/ci-sccache.sh start

      - name: Start sccache (read-only)
        if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) }}
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_ONLY
        run: bash scripts/ci-sccache.sh start

      # bench-check (lint part), the benchmark harness tests and the pack step in the CLI tests
      # (test parts) run through uv.
      - name: Set up uv
        if: matrix.part != 'package'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Cache Pandoc archive
        if: startsWith(matrix.part, 'test-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: pandoc-${{ runner.os }}-${{ hashFiles('scripts/install-pandoc.sh') }}

      - name: Enable namespaces for LibreOffice sandbox tests
        if: startsWith(matrix.part, 'test-')
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      # The runner's Azure mirror is tried first and archive.ubuntu.com is the fallback after a
      # failure or a time limit (scripts/ci-apt.sh). Either mirror stalled for several minutes on
      # some days: a LibreOffice install took 18 minutes instead of 20 seconds and the job hit its
      # limit. apt also aborts a transfer that stops moving for 30 seconds and retries it.
      # The LibreOffice and desktop library .deb files (about 500 MB) are cached per runner image
      # and restored on every run of the lint and test parts (the package part installs nothing).
      # Only the first test shard saves them, and only on a push to dev, so pull requests cannot
      # add entries, and the lint part, which installs the desktop libraries alone, can never
      # save an incomplete set under the key the test parts look up. apt checks each cached file
      # against the hashes in the package index, so a poisoned entry cannot change what gets
      # installed.
      - name: Select the apt package cache key
        id: apt-key
        if: matrix.part != 'package'
        run: echo "key=apt-debs-v1-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-cache
        if: matrix.part != 'package'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-debs-v1-

      - name: Update the package index
        if: matrix.part != 'package'
        timeout-minutes: 5
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          bash scripts/ci-apt.sh update

      # The three apt steps are limited to 25 minutes together (5 + 12 + 8), inside the 35-minute
      # job limit: the limits only bound a stalled mirror, and a normal run needs well under a
      # minute.
      - name: Install system LibreOffice
        if: startsWith(matrix.part, 'test-')
        timeout-minutes: 12
        run: |
          export APT_ARCHIVES="$HOME/.cache/ci-apt-archives"
          bash scripts/ci-apt.sh install --no-install-recommends -y libreoffice-writer libreoffice-calc libreoffice-impress qpdf
          soffice --version

      - name: Install Pandoc
        if: startsWith(matrix.part, 'test-')
        run: just pandoc

      - name: Set native Pandoc path
        if: startsWith(matrix.part, 'test-')
        run: printf 'ASHIFT_PANDOC=%s\n' "${GITHUB_WORKSPACE}/.tools/pandoc/bin/pandoc" >> "$GITHUB_ENV"

      - name: Verify Pandoc installation
        if: startsWith(matrix.part, 'test-')
        run: '"$ASHIFT_PANDOC" --version'

      # Clippy and the test compile both include the desktop crate, which needs these libraries.
      - name: Install Linux desktop prerequisites
        if: matrix.part != 'package'
        timeout-minutes: 8
        run: |
          export APT_ARCHIVES="$HOME/.cache/ci-apt-archives"
          bash scripts/ci-apt.sh install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      # Drop the .deb files of versions the index no longer offers, so that restoring the newest
      # older entry does not carry old packages forward forever.
      - name: Prune the apt package cache
        if: matrix.part == 'test-1' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.apt-cache.outputs.cache-hit != 'true'
        run: sudo apt-get -o "Dir::Cache::archives=$HOME/.cache/ci-apt-archives" autoclean

      - name: Store the apt package cache
        if: matrix.part == 'test-1' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-apt-archives/*.deb
          key: ${{ steps.apt-key.outputs.key }}

      - name: Run Clippy
        if: matrix.part == 'lint'
        run: just clippy

      # ariad-core must stay WASM-safe.
      - name: Check the WASM build
        if: matrix.part == 'lint'
        run: just wasm

      - name: Check the CLI without default features
        if: matrix.part == 'lint'
        run: cargo check -p ariad-cli --no-default-features

      - name: Check capabilities registry
        if: matrix.part == 'lint'
        run: just bench-check

      # One slice of `just test`. The shard index and count come from the matrix, so the scope job
      # is the only place that knows how many shards exist.
      - name: Run tests (shard)
        if: startsWith(matrix.part, 'test-')
        env:
          ARIAD_REQUIRE_OFFICE: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: just test-shard "$SHARD" "$SHARDS"

      # Doc tests build separately from the nextest run, in the last shard. Only the first shard
      # saves the Rust cache, so this build is not part of that entry; it is a small compile next
      # to the test build and sccache serves its dependencies.
      - name: Run doc tests
        if: startsWith(matrix.part, 'test-') && matrix.shard == matrix.shards
        env:
          ARIAD_REQUIRE_OFFICE: "1"
        run: just test-doc

      # The harness tests run the ashift binary that the test compile leaves in target/debug.
      - name: Run benchmark harness tests
        if: matrix.part == 'test-1'
        run: just bench-test

      - name: Check packaging
        if: matrix.part == 'package'
        run: just package-check

      - name: Stop sccache and report stats
        if: always()
        env:
          JOB_NAME: Verify (ubuntu-26.04, ${{ matrix.part }})
        run: bash scripts/ci-sccache.sh stop

  server:
    name: Server integration (ubuntu-26.04)
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'ci-cache-write' || '' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    services:
      postgres: &auth-test-postgres
        # justfile pins the same image for `just test-server`.
        image: ghcr.io/pgmq/pg18-pgmq:v1.13.1@sha256:aa3030fdacf5c199338bfe5c893fb8101e8233687026c4803e1fde61f520dac7
        env:
          POSTGRES_PASSWORD: ariad
          PGCTLTIMEOUT: "180"
        ports:
          - 55442:5432
        # TCP opens only after the image's init scripts finish.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      ARIAD_TEST_DATABASE_URL: postgres://postgres:ariad@127.0.0.1:55442/postgres
      ARIAD_TEST_REQUIRE_DATABASE: "1"
      ARIAD_TEST_S3_ENDPOINT: http://127.0.0.1:58342
      ARIAD_TEST_REQUIRE_SANDBOX: "1"
      SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Install command-line tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146,sccache@0.19.0

      - name: Start sccache (read-write)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_WRITE
        run: bash scripts/ci-sccache.sh start

      - name: Start sccache (read-only)
        if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) }}
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_ONLY
        run: bash scripts/ci-sccache.sh start

      - name: Cache Pandoc archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/
          key: pandoc-${{ runner.os }}-${{ hashFiles('scripts/install-pandoc.sh') }}

      - name: Install Pandoc
        run: just pandoc

      - name: Set native Pandoc path
        run: printf 'ASHIFT_PANDOC=%s\n' "${GITHUB_WORKSPACE}/.tools/pandoc/bin/pandoc" >> "$GITHUB_ENV"

      # Service containers cannot take a command, so SeaweedFS starts here.
      - name: Start SeaweedFS
        run: |
          docker run -d --name ariadshift-test-s3 -p 127.0.0.1:58342:8333 \
            -v "${GITHUB_WORKSPACE}/infra/test/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            "$SEAWEEDFS_IMAGE" server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data \
            -volume.max=32 -master.volumeSizeLimitMB=16
          for _ in $(seq 1 60); do
            if docker exec ariadshift-test-s3 sh -c 'echo "s3.bucket.create -name ariad-test" | weed shell' 2>/dev/null | grep -q 'created bucket'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 200 ariadshift-test-s3
          exit 1

      - name: Build the engine program
        run: cargo build -p ariad-cli --bin ashift

      # The pack is built from this commit, unsigned, as the PDFium pack workflow's
      # development route does, so no signing key or published pack is involved.
      - name: Install pack build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd

      - name: Build the PDFium engine
        run: cargo build -p ariad-pdfium-engine --bin ariad-pdfium-engine

      - name: Build the source-matched PDFium pack
        run: >-
          bash engines/pdfium/pack/make.sh dev
          --engine "$GITHUB_WORKSPACE/target/debug/ariad-pdfium-engine"
          --ashift "$GITHUB_WORKSPACE/target/debug/ashift"
          --out "$RUNNER_TEMP/pdfium-dist" --unpack-dir "$RUNNER_TEMP/pdfium-pack"

      # The pass line for cloud_tool_jobs redaction_refusals_reach_the_client_and_are_not_retried
      # appears in this step's log; a missing pack fails it instead of skipping.
      - name: Run server tests
        env:
          ASHIFT_PACK_PDFIUM: ${{ runner.temp }}/pdfium-pack
          ARIAD_REQUIRE_PDFIUM_PACK: "1"
        run: cargo nextest run -p ariad-server --status-level pass --final-status-level pass

      - name: Check required sandbox failure through the helper
        env:
          ARIAD_TEST_SANDBOX_SUPPORT: none
          ASHIFT_SANDBOX: off
        run: cargo nextest run -p ariad-server --test isolated -E 'test(required_mode_reaches_the_engine_through_the_helper)'

      - name: Check images and run a required-mode Pandoc container job
        run: just test-server-container

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.9.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: just js

      # The existing suite uses pg_dump with the service's major version.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo apt-get update
          version="$(apt-cache policy postgresql-client-18 | awk '/Candidate:/ {print $2}')"
          [[ -n "$version" && "$version" != '(none)' ]]
          printf 'Selected postgresql-client-18=%s\n' "$version"
          sudo apt-get install --no-install-recommends -y "postgresql-client-18=$version"
          pg_dump --version | grep -q ' 18\.'

      - name: Run the auth service's PostgreSQL suite
        run: just test-auth-db

      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f ariadshift-test-s3 || true

      - name: Stop sccache and report stats
        if: always()
        env:
          JOB_NAME: Server integration
        run: bash scripts/ci-sccache.sh stop

      - name: Set up uv
        if: always()
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Prune R2 cache storage (read-write)
        if: always() && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
        continue-on-error: true
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_WRITE
        run: uv run --no-project --with-requirements scripts/r2-cache-requirements.txt python scripts/r2-cache-prune.py --prune

      - name: Report R2 cache storage (read-only)
        if: always() && !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
        continue-on-error: true
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_ONLY
        run: uv run --no-project --with-requirements scripts/r2-cache-requirements.txt python scripts/r2-cache-prune.py --report-only

  fuzz:
    name: Fuzz
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-26.04
    # Pull requests run a 5-minute smoke across all targets (10 s per target, 280 s fuzzing budget).
    # Pushes to dev/main run the full 60 s per target (1680 s / 28 min total fuzzing).
    # Nightly AddressSanitizer fuzzing (fuzz-nightly.yml) covers all targets for 600 s each.
    timeout-minutes: 45
    environment: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'ci-cache-write' || '' }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Install command-line tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: sccache@0.19.0

      - name: Start sccache (read-write)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_WRITE
        run: bash scripts/ci-sccache.sh start

      - name: Start sccache (read-only)
        if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) }}
        env:
          SCCACHE_BUCKET: ${{ vars.R2_CACHE_BUCKET }}
          SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
          SCCACHE_S3_KEY_PREFIX: ariadshift-sccache-v2/
          SCCACHE_S3_RW_MODE: READ_ONLY
        run: bash scripts/ci-sccache.sh start

      - name: Restore cargo-fuzz binary
        id: restore-cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi

      - name: Save cargo-fuzz binary
        if: github.event_name == 'push' && steps.restore-cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Restore fuzz target cache
        id: restore-fuzz-target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: fuzz-target-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            fuzz-target-${{ runner.os }}-

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Test package metadata fuzz oracle
        run: cargo test --locked --manifest-path fuzz/Cargo.toml --bin docx_meta

      - name: Run fuzz targets
        run: |
          # Pull requests run a fast smoke with a 5-minute maximum total fuzzing
          # budget across all targets (10 s per target = 280 s total fuzzing time).
          # Pushes to dev/main run the full 60 s per target (1680 s / 28 min total).
          # Nightly ASan fuzzing (fuzz-nightly.yml) covers all targets for 600 s each.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            fuzz_seconds=10
            fuzz_args=(-- -max_total_time=10 -timeout=10 -rss_limit_mb=2048)
          else
            fuzz_seconds=60
            fuzz_args=(-- -max_total_time=60 -timeout=10 -rss_limit_mb=2048)
          fi
          echo "Running fuzz targets with max_total_time=${fuzz_seconds}s per target"
          targets="markdown_reader front_matter html_reader pandoc_ast_to_ir docling_to_ir ir_json limits_validate pdf_reader pdf_draw_params pdf_form_interchange pdf_form_structure pdf_redact_params type1_to_cff typst_writer archive_preflight docx_meta pack_manifest pack_archive engine_protocol capabilities_json asset_resolve uri_parsers ir_json_versioned reader_text reader_csv reader_eml reader_msg reader_svg reader_cbz"
          for t in $targets; do
            echo "=== Running fuzz target: $t (${fuzz_seconds}s) ==="
            mkdir -p "fuzz/corpus/$t"
            build_options=()
            case "$t" in
              pdf_reader|pdf_draw_params|pdf_form_interchange|pdf_form_structure|pdf_redact_params|type1_to_cff|reader_cbz) build_options=(--dev --features pdf-reader) ;;
              typst_writer) build_options=(--dev --features typst-writer) ;;
            esac
            cargo fuzz run -s none "${build_options[@]}" "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" "${fuzz_args[@]}"
          done

      # The fuzz target directory is about 2 GB, and every lock file or toolchain change used to
      # save a fresh entry on a dev push. Together with the three Verify caches that exceeds the
      # 10 GB repository limit, so only a manual run on dev saves it. Pushes restore the closest entry
      # through the restore-keys prefix above. Only a run on dev may write it.
      - name: Save fuzz target cache
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && steps.restore-fuzz-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/target
          key: fuzz-target-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save fuzz corpus
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/
          key: fuzz-corpus-${{ runner.os }}-${{ github.sha }}

      - name: Upload crash artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 14

      - name: Stop sccache and report stats
        if: always()
        env:
          JOB_NAME: Fuzz
        run: bash scripts/ci-sccache.sh stop

  web:
    name: Web
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Auth-only changes skip the Rust/server jobs but still run web Vitest.
      ARIAD_TEST_DATABASE_URL: postgres://postgres:ariad@127.0.0.1:55442/postgres
      ARIAD_TEST_REQUIRE_DATABASE: "1"
    services:
      postgres: *auth-test-postgres
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Install command-line tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.9.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: just js

      # The existing suite uses pg_dump with the service's major version.
      - name: Install the PostgreSQL 18 client
        run: |
          sudo apt-get update
          version="$(apt-cache policy postgresql-client-18 | awk '/Candidate:/ {print $2}')"
          [[ -n "$version" && "$version" != '(none)' ]]
          printf 'Selected postgresql-client-18=%s\n' "$version"
          sudo apt-get install --no-install-recommends -y "postgresql-client-18=$version"
          pg_dump --version | grep -q ' 18\.'

      # Builds the wasm module, then typechecks, runs Vitest and builds the site.
      - name: Typecheck, unit tests and production build
        run: just web-ci

      - name: Restore Playwright browsers
        id: restore-playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Use the primary Ubuntu archive for browser libraries
        run: |
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done

      - name: Install Playwright browsers and their system packages
        run: just web-browsers --with-deps

      - name: Save Playwright browsers
        if: github.event_name == 'push' && steps.restore-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run end-to-end tests on Chromium, Firefox and WebKit
        run: just web-e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 14

  ci-passed:
    name: CI passed
    needs: [scope, static, lint-windows, verify, verify-linux, server, fuzz, web]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          HEAVY: ${{ needs.scope.outputs.heavy }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static.result }}
          WINDOWS: ${{ needs.lint-windows.result }}
          VERIFY: ${{ needs.verify.result }}
          # One result for the whole matrix: success only when every part that ran succeeded, so a
          # packaging part the scope left out cannot fail it.
          VERIFY_LINUX: ${{ needs.verify-linux.result }}
          SERVER: ${{ needs.server.result }}
          FUZZ: ${{ needs.fuzz.result }}
          WEB: ${{ needs.web.result }}
        run: |
          printf 'scope=%s static=%s lint-windows=%s verify=%s verify-linux=%s server=%s fuzz=%s web=%s heavy=%s web-scope=%s\n' \
            "$SCOPE" "$STATIC" "$WINDOWS" "$VERIFY" "$VERIFY_LINUX" "$SERVER" "$FUZZ" "$WEB" "$HEAVY" "$WEB_SCOPE"
          [ "$SCOPE" = success ] && [ "$STATIC" = success ] || exit 1
          if [ "$HEAVY" = true ]; then
            [ "$WINDOWS" = success ] && [ "$VERIFY" = success ] && [ "$VERIFY_LINUX" = success ] && [ "$SERVER" = success ] && [ "$FUZZ" = success ] || exit 1
          else
            [ "$WINDOWS" = skipped ] && [ "$VERIFY" = skipped ] && [ "$VERIFY_LINUX" = skipped ] && [ "$SERVER" = skipped ] && [ "$FUZZ" = skipped ] || exit 1
          fi
          if [ "$WEB_SCOPE" = true ]; then
            [ "$WEB" = success ] || exit 1
          else
            [ "$WEB" = skipped ] || exit 1
          fi
