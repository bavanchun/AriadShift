name: Links

# External links rot without any change here, so the docs on dev are checked
# weekly. Pull requests run it only when the link check itself changes.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths: [.github/workflows/links.yml, lychee.toml]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress "./**/*.md"
