name: Images

# Container images for linux/amd64 and linux/arm64, each built on a native runner:
# ariadshift-api and ariadshift-worker-core (infra/docker/server.Dockerfile),
# ariadshift-worker-office, ariadshift-worker-docling, ariadshift-auth
# (services/auth/Dockerfile) and ariadshift-web. A v* tag pushes them to GHCR as
# multi-platform images with SBOM and provenance attestations and signs every image
# index by digest with keyless cosign. A manual run builds the same images and pushes
# nothing. docs/self-hosting.md describes running the published images.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  BUILDX_VERSION: v0.38.0
  COSIGN_VERSION: v3.1.3

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # tag builds push each platform's images by digest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docling image holds LibreOffice, PyTorch and the Docling models on top of
      # the server image; the preinstalled SDKs below are not needed here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: false

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One definition per platform. The worker images start from the server image
      # through `target:` contexts, so the chain builds in one builder without a
      # registry, which is what lets a manual run build everything without pushing.
      - name: Write the Bake definition
        run: |
          cat > "$RUNNER_TEMP/images.hcl" <<'EOF'
          variable "IMAGE_PREFIX" { default = "ghcr.io/ariadshift" }
          variable "PLATFORM" { default = "linux/amd64" }
          variable "PUSH" { default = "false" }
          variable "VERSION" { default = "dev" }
          variable "REVISION" { default = "" }
          variable "SOURCE" { default = "" }

          function "output" {
            params = [name]
            result = ["type=image,name=${IMAGE_PREFIX}/ariadshift-${name},push-by-digest=true,name-canonical=true,push=${PUSH}"]
          }

          target "_common" {
            context = "."
            platforms = [PLATFORM]
            attest = ["type=provenance,mode=max", "type=sbom"]
            labels = {
              "org.opencontainers.image.source" = SOURCE
              "org.opencontainers.image.revision" = REVISION
              "org.opencontainers.image.version" = VERSION
            }
          }

          group "core" {
            targets = ["api", "worker-core", "worker-office", "auth", "web"]
          }

          target "api" {
            inherits = ["_common"]
            dockerfile = "infra/docker/server.Dockerfile"
            target = "server"
            output = output("api")
          }

          target "worker-core" {
            inherits = ["_common"]
            contexts = { "ariadshift-server" = "target:api" }
            dockerfile-inline = "FROM ariadshift-server\nCMD [\"worker\", \"--packs\", \"core\"]\n"
            output = output("worker-core")
          }

          target "worker-office" {
            inherits = ["_common"]
            dockerfile = "infra/docker/worker-office.Dockerfile"
            args = { SERVER_IMAGE = "ariadshift-server" }
            contexts = { "ariadshift-server" = "target:api" }
            output = output("worker-office")
          }

          target "worker-docling" {
            inherits = ["_common"]
            dockerfile = "infra/docker/worker-docling.Dockerfile"
            args = { SERVER_IMAGE = "ariadshift-worker-office" }
            contexts = { "ariadshift-worker-office" = "target:worker-office" }
            output = output("worker-docling")
          }

          target "auth" {
            inherits = ["_common"]
            dockerfile = "services/auth/Dockerfile"
            output = output("auth")
          }

          target "web" {
            inherits = ["_common"]
            dockerfile = "infra/docker/web.Dockerfile"
            target = "web"
            output = output("web")
          }
          EOF

      - name: Build the server, Office, auth and web images
        env:
          PLATFORM: ${{ matrix.platform }}
          PUSH: ${{ github.event_name == 'push' }}
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx bake --file "$RUNNER_TEMP/images.hcl" \
            --metadata-file "$RUNNER_TEMP/core.json" core

      # The docling image installs the published signed Docling pack, so it fails
      # until that pack exists. It reuses the office image from the builder's cache.
      # A failure here does not stop the other images; the job fails at the end.
      - name: Build the docling image
        id: docling
        continue-on-error: true
        env:
          PLATFORM: ${{ matrix.platform }}
          PUSH: ${{ github.event_name == 'push' }}
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx bake --file "$RUNNER_TEMP/images.hcl" \
            --metadata-file "$RUNNER_TEMP/docling.json" worker-docling

      - name: Record image digests
        if: github.event_name == 'push'
        env:
          ARCH: ${{ matrix.arch }}
          DOCLING: ${{ steps.docling.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          {
            jq -r '["api", "worker-core", "worker-office", "auth", "web"][] as $image
              | "\($image) \(.[$image]["containerimage.digest"] // "missing")"' "$RUNNER_TEMP/core.json"
            if [ "$DOCLING" = success ]; then
              jq -r '"worker-docling \(.["worker-docling"]["containerimage.digest"] // "missing")"' \
                "$RUNNER_TEMP/docling.json"
            fi
          } |
            while read -r image digest; do
              if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::unexpected digest for $image: $digest"
                exit 1
              fi
              printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$image-$ARCH"
              echo "$image $ARCH $digest"
            done

      - name: Upload image digests
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Fail when the docling image did not build
        if: steps.docling.outcome == 'failure'
        run: |
          echo "::error::The docling image did not build; see the 'Build the docling image' step."
          exit 1

  publish:
    name: Publish ariadshift-${{ matrix.image }}
    needs: build
    # Runs after a docling failure too, so the other images still publish.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      packages: write # pushes the image index and its cosign signature
      id-token: write # keyless cosign signing through the GitHub OIDC token
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker-core, worker-office, worker-docling, auth, web]
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Create the multi-platform image
        id: index
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $VERSION is not a release version"
            exit 1
          fi
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ariadshift-$IMAGE"
          sources=()
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/digests/$IMAGE-$arch"
            if [ ! -f "$file" ]; then
              echo "::error::ariadshift-$IMAGE was not built for linux/$arch; see the build job."
              exit 1
            fi
            sources+=("$ref@$(cat "$file")")
          done
          docker buildx imagetools create \
            --tag "$ref:$VERSION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$ref:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected index digest: $digest"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$ref:$VERSION is $digest"

      - name: Sign the image
        env:
          REF: ${{ steps.index.outputs.ref }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$REF@$DIGEST"

      - name: Verify the signature
        env:
          REF: ${{ steps.index.outputs.ref }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$REF@$DIGEST" > /dev/null
          echo "Verify with: cosign verify --certificate-identity $GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF --certificate-oidc-issuer https://token.actions.githubusercontent.com $REF@$DIGEST"
