name: Fuzz (Nightly)

# Nightly AddressSanitizer fuzzing for unsafe-adjacent parsers.
# Rules and rationale: docs/ci.md and ARCHITECTURE.md §14.
on:
  schedule:
    # 02:00 UTC daily (09:00 Asia/Saigon).
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/fuzz-nightly.yml]

# Scheduled runs check out dev to fuzz the integration branch before promotion.
# PR runs test workflow syntax and configuration changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz-nightly:
    name: Fuzz (ASan, ${{ matrix.target }})
    runs-on: ubuntu-26.04
    # One target per job: 10 minutes of fuzzing plus the toolchain, a cargo-fuzz install on a
    # cache miss and one ASan build, so adding a target never eats into another's budget.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - markdown_reader
          - front_matter
          - html_reader
          - pandoc_ast_to_ir
          - docling_to_ir
          - ir_json
          - limits_validate
          - pdf_reader
          - typst_writer
          - archive_preflight
          - docx_meta
          - pack_manifest
          - pack_archive
          - engine_protocol
          - capabilities_json
          - asset_resolve
          - uri_parsers
          - ir_json_versioned
          - page_range
          - recipe_json
          - pdf_open_bounded
          - pdf_tools_structural
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - name: Install date-pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-10-05 --profile minimal

      - name: Restore cargo-fuzz
        id: restore-cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi

      - name: Save cargo-fuzz binary
        if: github.event_name == 'schedule' && matrix.target == 'markdown_reader' && steps.restore-cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-nightly-corpus-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-nightly-corpus-${{ runner.os }}-${{ matrix.target }}-

      - name: Run AddressSanitizer fuzzing
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "=== Running ASan fuzz target: $TARGET (600s) ==="
          mkdir -p "fuzz/corpus/$TARGET"
          build_options=()
          case "$TARGET" in
            pdf_reader|pdf_open_bounded|pdf_tools_structural) build_options=(--dev --features pdf-reader) ;;
            typst_writer) build_options=(--dev --features typst-writer) ;;
          esac
          cargo +nightly-2026-10-05 fuzz run "${build_options[@]}" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- -max_total_time=600 -timeout=25 -rss_limit_mb=2048

      - name: Save fuzz corpus
        if: github.event_name == 'schedule' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-nightly-corpus-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-nightly-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 14
