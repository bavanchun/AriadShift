name: sign pack

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - engines/sign/**
      - engines/common/**
      - crates/ariad-host/src/engines/sign.rs
      - crates/ariad-host/src/tools/sign.rs
      - crates/ariad-host/tests/sign_adapter.rs
      - .github/workflows/pack-sign.yml
  push:
    tags: ['pack-sign-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: Sign engine tests and verification (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Install command-line tools
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just@1.58.0

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Sync sign virtualenv
        run: uv sync --project engines/sign --frozen

      - name: Run sign ruff check
        run: uv run --directory engines/sign --frozen ruff check src

      - name: Run sign pytest suite
        run: uv run --project engines/sign pytest engines/sign/tests

      - name: Run shared licenses tests
        run: uv run --project engines/sign pytest engines/common/tests

      - name: Run license audit gate
        run: uv run --project engines/sign python engines/sign/pack/licenses.py

      - name: Run Rust sign adapter tests with ARIAD_REQUIRE_SIGN_PACK
        env:
          ARIAD_REQUIRE_SIGN_PACK: "1"
        run: |
          cargo test -p ariad-host --test sign_adapter
          cargo test -p ariad-cli --test secrets_surfaces --test mcp_secrets
          cargo test -p ariad-cli --features ariad-host/test-probe --test engine_conformance_v2 real_sign_engine_conformance

  pack-build:
    name: Build sign pack (${{ matrix.target }})
    needs: engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Build sign pack
        run: uv run --no-project --python 3.14 python engines/sign/pack/build.py build --target "${{ matrix.target }}" --out pack-dist

      - name: Verify pack conformance
        run: uv run --no-project --python 3.14 python engines/sign/pack/build.py conformance --out pack-dist --target "${{ matrix.target }}"

      - name: Upload pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-pack-${{ matrix.target }}
          path: pack-dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 14 }}

  manifest:
    name: Assemble multi-target sign manifest
    needs: pack-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Download target pack artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sign-pack-*
          path: pack-dist
          merge-multiple: true

      - name: Merge multi-target pack manifest
        run: uv run --no-project --python 3.14 python engines/sign/pack/build.py merge --out pack-dist

      - name: Upload merged pack manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-manifest
          path: pack-dist/pack.toml
          if-no-files-found: error

  release:
    name: Sign and publish sign engine pack
    needs: manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pack-sign-v')
    runs-on: ubuntu-26.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PACK_SIGNING_KEY_ID: ${{ vars.PACK_SIGNING_KEY_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the trusted public key
        run: |
          [[ "$PACK_SIGNING_KEY_ID" =~ ^[0-9A-Fa-f]{16}$ ]]
          echo "PUBLIC_KEY=crates/ariad-host/data/pack-keys/${PACK_SIGNING_KEY_ID,,}.pub" >> "$GITHUB_ENV"

      - name: Require approval and stable branch ancestry
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign zstd

      - name: Download target pack artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sign-pack-*
          path: pack-dist
          merge-multiple: true

      - name: Download merged pack manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sign-manifest
          path: pack-dist

      - name: Sign and publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.PACK_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.PACK_MINISIGN_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/pack/sign-pack.sh --name sign --version 0.1.0 --manifest pack-dist/pack.toml --public-key "$PUBLIC_KEY"
          (cd pack-dist && sha256sum sign-*.tar.zst > SHA256SUMS)
          key_dir=$(mktemp -d "$RUNNER_TEMP/sign-pack-sign.XXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key_dir/key" -m pack-dist/SHA256SUMS -t "sign evidence $TAG"
          minisign -V -p "$PUBLIC_KEY" -m pack-dist/SHA256SUMS
          (cd pack-dist && sha256sum --check SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes 'Signed sign engine pack.' pack-dist/pack.toml pack-dist/pack.toml.minisig pack-dist/*.tar.zst pack-dist/SHA256SUMS pack-dist/SHA256SUMS.minisig
