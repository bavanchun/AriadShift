name: Benchmark

# Benchmark harness execution and capability metric tracking.
# Rules and rationale: docs/bench.md and ARCHITECTURE.md §14.
on:
  schedule:
    # 03:00 UTC daily (10:00 Asia/Saigon).
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

# A new push to a PR cancels its older benchmark run. Scheduled runs check out dev.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (Ubuntu)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'bench') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'bench'))
      ))
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Install command-line tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146

      - name: Install Pandoc
        run: bash scripts/install-pandoc.sh

      - name: Install document engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr libreoffice-writer libreoffice-calc libreoffice-impress
          soffice --version
          tesseract --version

      - name: Cache models and OCR data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ariadshift/docling
          key: docling-assets-${{ hashFiles('engines/docling/pack/pins.toml') }}

      - name: Set up the Docling engine
        run: just docling-dev

      - name: Build ashift CLI
        run: cargo build --release -p ariad-cli --features ariad-host/test-probe

      - name: Run real Docling conformance
        env:
          ASHIFT_DOCLING_ENGINE: '"${{ github.workspace }}/.tools/docling/python-env/bin/python" -I -m ariad_docling'
          ASHIFT_PANDOC: ${{ github.workspace }}/.tools/pandoc/bin/pandoc
        run: >-
          cargo nextest run --release -p ariad-cli --features ariad-host/test-probe
          --run-ignored ignored-only --test-threads 2 -E 'binary(docling_engine)'

      - name: Run benchmark harness
        run: |
          PATH="$PWD/.tools/pandoc/bin:$PATH" ASHIFT_PANDOC="$PWD/.tools/pandoc/bin/pandoc" just bench | tee bench-run.log

      - name: Measure heavy routes
        env:
          ASHIFT_DOCLING_ENGINE: '"${{ github.workspace }}/.tools/docling/python-env/bin/python" -I -m ariad_docling'
        run: just bench-heavy

      - name: Generate the public report
        run: just bench-report

      - name: Upload measured capabilities and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            crates/ariad-core/data/capabilities.json
            bench/results/heavy-routes.json
            docs/bench-report.md
          if-no-files-found: error

      - name: Generate diff summary
        run: |
          {
            echo "## Benchmark Results"
            uv run --package ariad-bench python -m ariad_bench diff
            if grep -q "Benchmark Run Summary:" bench-run.log; then
              echo ""
              echo "### Run Details"
              echo '```'
              sed -n '/Benchmark Run Summary:/,$p' bench-run.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate capabilities schema and invariants
        run: just bench-check
