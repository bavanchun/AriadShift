name: Release
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'dist-workspace.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-crates.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'about.toml'
      - 'about.hbs'
      - 'NOTICE'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES'
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-26.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # Pinned cargo-dist v0.33.0 archive with SHA-256 integrity verification.
      # To refresh the checksum when bumping cargo-dist-version:
      #   gh release view v<VERSION> --repo axodotdev/cargo-dist --json assets
      # Note: Expected SHA-256 hashes must also be updated in scripts/check-release-workflow.sh.
      - name: Install dist
        shell: bash
        run: |
          DIST_VERSION="v0.33.0"
          DIST_ARCHIVE="cargo-dist-x86_64-unknown-linux-musl.tar.xz"
          DIST_URL="https://github.com/axodotdev/cargo-dist/releases/download/${DIST_VERSION}/${DIST_ARCHIVE}"
          EXPECTED_SHA="b8e95bc76c63375958173ef5ae2dbd8e9211cc1ed03cdee0899702766b4c2a2e"

          curl --proto '=https' --tlsv1.2 -LsSf "$DIST_URL" -o "$DIST_ARCHIVE"
          echo "${EXPECTED_SHA}  ${DIST_ARCHIVE}" | shasum -a 256 -c -
          mkdir -p ~/.cargo/bin
          tar -xJf "$DIST_ARCHIVE" --strip-components=1 -C ~/.cargo/bin "cargo-dist-x86_64-unknown-linux-musl/dist"
          chmod +x ~/.cargo/bin/dist
          rm -f "$DIST_ARCHIVE"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            dist plan --output-format=json > plan-dist-manifest.json
          else
            dist host --steps=create --tag="$REF_NAME" --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # Verified dist installer (Unix: bash, Windows: pwsh) with SHA-256 check
      - name: Install dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIST_VERSION="v0.33.0"
          if [ "$RUNNER_OS" = "macOS" ]; then
            DIST_ARCHIVE="cargo-dist-aarch64-apple-darwin.tar.xz"
            EXPECTED_SHA="7b3cbe25511de01d74c0f5fcb7909edabd379bea9cfa284d93af5a3cdfa3247c"
          elif [ "$RUNNER_ARCH" = "ARM64" ]; then
            DIST_ARCHIVE="cargo-dist-aarch64-unknown-linux-musl.tar.xz"
            EXPECTED_SHA="4761cff5fc547ad66d1449abbf321380b0e6bd8093b1fe6593852a3314fd0c19"
          else
            DIST_ARCHIVE="cargo-dist-x86_64-unknown-linux-musl.tar.xz"
            EXPECTED_SHA="b8e95bc76c63375958173ef5ae2dbd8e9211cc1ed03cdee0899702766b4c2a2e"
          fi

          DIST_URL="https://github.com/axodotdev/cargo-dist/releases/download/${DIST_VERSION}/${DIST_ARCHIVE}"
          curl --proto '=https' --tlsv1.2 -LsSf "$DIST_URL" -o "$DIST_ARCHIVE"
          echo "${EXPECTED_SHA}  ${DIST_ARCHIVE}" | shasum -a 256 -c -
          mkdir -p ~/.cargo/bin
          tar -xJf "$DIST_ARCHIVE" --strip-components=1 -C ~/.cargo/bin "${DIST_ARCHIVE%.tar.xz}/dist"
          chmod +x ~/.cargo/bin/dist
          rm -f "$DIST_ARCHIVE"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $distVersion = "v0.33.0"
          $archive = "cargo-dist-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/axodotdev/cargo-dist/releases/download/$distVersion/$archive"
          $expectedHash = "9a36d70795e14326a5ec4bf17aee085df00ab85a322739291ea5d4b1b5f693cd"
          $dest = "$env:RUNNER_TEMP\$archive"
          Invoke-RestMethod -Uri $url -OutFile $dest
          $actualHash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "SHA-256 mismatch for ${archive}: expected $expectedHash, got $actualHash"
          }
          $binDir = "$env:USERPROFILE\.cargo\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Expand-Archive -Path $dest -DestinationPath $binDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

      - name: Install cargo-auditable
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-auditable@0.7.7

      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        if: matrix.packages_install != null
        shell: bash
        env:
          PACKAGES_INSTALL: ${{ matrix.packages_install }}
        run: bash -ec "$PACKAGES_INSTALL"
      - name: Build artifacts
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-26.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Install cargo-cyclonedx
        shell: bash
        run: |
          mkdir -p ~/.cargo/bin
          CYCLONEDX_VERSION="0.5.9"
          CYCLONEDX_ARCHIVE="cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz"
          CYCLONEDX_URL="https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/${CYCLONEDX_ARCHIVE}"
          EXPECTED_SHA="9bd3e599314f50810c9d98b8b68a617ff9d3cc20873968d90b29d121f6b226ff"

          curl --proto '=https' --tlsv1.2 -LsSf "$CYCLONEDX_URL" -o /tmp/cyclonedx.tar.xz
          echo "${EXPECTED_SHA}  /tmp/cyclonedx.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/cyclonedx.tar.xz --strip-components=1 -C ~/.cargo/bin/ cargo-cyclonedx-x86_64-unknown-linux-musl/cargo-cyclonedx
          chmod +x ~/.cargo/bin/cargo-cyclonedx
          rm -f /tmp/cyclonedx.tar.xz
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - id: cargo-cyclonedx
        shell: bash
        run: |
            # Generate SBOM (.cdx.xml) files.
            cargo cyclonedx -v

            # Move all SBOM (.cdx.xml) files under target/distrib/ since
            # we expect all artifacts to be in that folder.
            find . -name '*.cdx.xml' -exec mv '{}' target/distrib/ ';'

            echo "paths<<EOF" >> "$GITHUB_OUTPUT"
            find . -name '*.cdx.xml' | tee -a "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.cargo-cyclonedx.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: "ubuntu-26.04"
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          # shellcheck disable=SC2086
          dist host $TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          # shellcheck disable=SC2086
          gh release create "$TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # Job A: Format formula with brew in a job without tap credentials
  prepare-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    env:
      PLAN: ${{ needs.plan.outputs.val }}
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "bavanchun/homebrew-tap"
          path: homebrew-tap
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: homebrew-tap/Formula/
          merge-multiple: true
      - name: Format formula with brew
        run: |
          cd homebrew-tap
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew update
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true
          done
      - name: Upload prepared formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-homebrew-formula
          path: homebrew-tap/Formula/*.rb

  # Job B: Commit and push formula in release environment with no brew
  publish-homebrew-formula:
    needs:
      - plan
      - host
      - prepare-homebrew-formula
    environment: "release"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "bavanchun/homebrew-tap"
      - name: Fetch prepared formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-homebrew-formula
          path: Formula/
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name="${filename%.rb}"
            version=$(echo "$release" | jq .app_version --raw-output)

            git add "Formula/${filename}"
            git commit -m "${name} ${version}" || echo "Formula already up-to-date"
          done
      - name: Push formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          basic_auth=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${basic_auth}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_auth}" git push https://github.com/bavanchun/homebrew-tap.git HEAD:main

  custom-publish-crates:
    needs:
      - plan
      - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    # Reusable workflow is co-located in the same repository commit.
    uses: ./.github/workflows/publish-crates.yml # zizmor: ignore[self-repository]
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    permissions:
      contents: read

  announce:
    needs:
      - plan
      - host
      - prepare-homebrew-formula
      - publish-homebrew-formula
      - custom-publish-crates
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') && (needs.custom-publish-crates.result == 'skipped' || needs.custom-publish-crates.result == 'success') }}
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
