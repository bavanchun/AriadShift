# and patched for pinned action integrity, SHA-256 installer verification,
# and secret isolation.
#
# Documented hand patches applied to dist-generated workflow:
# 1. Top-level permissions: restricted to 'contents: read'; only 'host' job has 'contents: write'; explicit 'contents: read' on unprivileged jobs.
# 2. Concurrency: group defined with cancel-in-progress enabled for pull requests only.
# 3. Pull request triggers: scoped with paths filter to release-relevant configuration and sources.
# 4. Plan job dist install: replaced unverified 'curl | sh' with SHA-256-verified musl archive download via shasum.
# 5. Plan job outputs and env: env indirection for REF_NAME and IS_PR avoiding template expressions in script body.
# 6. Container removal: removed unused matrix.container runner configuration and container step field.
# 7. Rustup step removal: removed 'Install Rust non-interactively if not already installed' since runners have toolchains.
# 8. Build-local-artifacts dist install: replaced matrix.install_dist with per-runner SHA-256-verified archive downloads via literal member path and Get-FileHash.
# 9. Cargo-auditable reorder: installed pinned taiki-e/install-action v2.87.26 with cargo-auditable@0.7.7 before artifact fetch step.
# 10. Dependencies install: guarded with if: matrix.packages_install != null and executed via PACKAGES_INSTALL env with bash -ec.
# 11. Build artifacts bash shell: added shell: bash and env indirection for TAG_FLAG and DIST_ARGS.
# 12. Post-build outputs grouping: rewritten to multiline GITHUB_OUTPUT grouping block.
# 13. CycloneDX install: replaced unverified installer with SHA-256-verified 0.5.9 musl archive download.
# 14. CycloneDX outputs key: fixed typo in generated outputs key (output.paths -> outputs.paths).
# 15. Global-dist outputs and env: env indirection for TAG_FLAG and rewritten to multiline GITHUB_OUTPUT jq block.
# 16. Host job env indirection: env indirection for TAG_FLAG and TAG in Create GitHub Release step.
# 17. Release notes quoting: quoted $RUNNER_TEMP/notes.txt path to prevent word splitting.
# 18. Homebrew job split: split into unprivileged 'prepare-homebrew-formula' (no token, brew update/style) and 'publish-homebrew-formula' (environment: release, no brew).
# 19. Homebrew formula push: push via http.extraheader basic credential using GIT_CONFIG_COUNT env and ::add-mask:: with explicit push to HEAD:main.
# 20. Formula commit idempotence: git commit || echo 'Formula already up-to-date' to avoid failure on unchanged formula.
# 21. Formula filename parsing: name="${filename%.rb}" bash parameter expansion instead of sed.
# 22. Crates publishing: invokes reusable workflow with explicit secret passing, persist-credentials: false, and with: plan removed.
# 23. Action pinning: all GitHub Actions pinned to full commit SHAs with # vX version tag comments documented.
# 24. Comment cleanup: removed default dist explanatory comment blocks.
