name: tesseract pack
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - engines/tesseract/**
      - engines/docling/pack/pins.toml
      - engines/pdfium/pack/**
      - crates/ariad-host/**
      - crates/ariad-pdfium-engine/**
      - scripts/pack/**
      - scripts/test-pack-tesseract.sh
      - justfile
      - .github/workflows/pack-tesseract.yml
  push:
    tags: ['pack-tesseract-v*']

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck engines/tesseract/pack/*.sh scripts/test-pack-tesseract.sh
      - run: bash scripts/test-pack-tesseract.sh
      - run: bash scripts/test-ci-scope.sh

  source-build:
    needs: tooling
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: linux-x64, os: ubuntu-26.04, image: 'quay.io/pypa/manylinux_2_28_x86_64@sha256:f6adcfd450f0927a05c66ded9b4c3bb538fbab625b1ca3f35d71ac093b24b57f'}
          - {slug: linux-arm64, os: ubuntu-26.04-arm, image: 'quay.io/pypa/manylinux_2_28_aarch64@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676'}
          - {slug: mac-arm64, os: macos-26, image: ''}
          - {slug: mac-x64, os: macos-26-intel, image: ''}
    env:
      SLUG: ${{ matrix.slug }}
      IMAGE: ${{ matrix.image }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd poppler-utils
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install pkgconf zstd gnu-tar poppler
      - name: Install pinned CMake
        run: bash engines/tesseract/pack/install-cmake.sh "$RUNNER_TEMP/cmake"
      - name: Download verified source and models
        run: python3 engines/tesseract/pack/fetch-inputs.py "$RUNNER_TEMP/tesseract-input"
      - name: Compile and compare Linux binaries
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/tesseract-first" "$RUNNER_TEMP/tesseract-second"
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/cmake:/cmake:ro" -v "$RUNNER_TEMP/tesseract-input:/input:ro" -v "$RUNNER_TEMP/tesseract-first:/first" -v "$RUNNER_TEMP/tesseract-second:/second" "$IMAGE" bash -e -o pipefail -c '
            export PATH=/cmake/bin:$PATH
            bash /work/engines/tesseract/pack/compile-tesseract.sh /input/tesseract.tar.gz /input/leptonica.tar.gz /first
            bash /work/engines/tesseract/pack/compile-tesseract.sh /input/tesseract.tar.gz /input/leptonica.tar.gz /second
            cmp /first/bin/tesseract /second/bin/tesseract
            ldd /first/bin/tesseract
            objdump -T /first/bin/tesseract | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -1
          '
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/tesseract-first" "$RUNNER_TEMP/tesseract-second"
      - name: Compile macOS binary
        if: runner.os == 'macOS'
        run: |
          if [ -x "$RUNNER_TEMP/cmake/Contents/bin/cmake" ]; then
            export PATH="$RUNNER_TEMP/cmake/Contents/bin:$PATH"
          else
            export PATH="$RUNNER_TEMP/cmake/CMake.app/Contents/bin:$PATH"
          fi
          cmake --version
          bash engines/tesseract/pack/compile-tesseract.sh "$RUNNER_TEMP/tesseract-input/tesseract.tar.gz" "$RUNNER_TEMP/tesseract-input/leptonica.tar.gz" "$RUNNER_TEMP/tesseract-first"
      - name: Build manifest tool
        run: cargo build -p ariad-cli --bin ashift
      - name: Assemble unsigned pack
        run: |
          bash engines/tesseract/pack/make.sh pack "$SLUG" "$RUNNER_TEMP/tesseract-first" "$RUNNER_TEMP/tesseract-input/tessdata" "$GITHUB_WORKSPACE/target/debug/ashift" "$RUNNER_TEMP/tesseract-pack"
          python3 -c 'import pathlib, sys, tomllib; assert tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["requires_ashift"] == ">=0.4.0, <2.0.0"' "$RUNNER_TEMP/tesseract-pack/pack.toml"
          bash engines/tesseract/pack/make.sh verify "$RUNNER_TEMP/tesseract-pack"
          TESSERACT_TEST_PACK="$RUNNER_TEMP/tesseract-pack" bash scripts/test-pack-tesseract.sh
      - name: Build PDFium development pack
        if: matrix.slug != 'linux-arm64'
        run: |
          cargo build --locked -p ariad-pdfium-engine --bin ariad-pdfium-engine
          bash engines/pdfium/pack/make.sh dev --engine "$GITHUB_WORKSPACE/target/debug/ariad-pdfium-engine" --ashift "$GITHUB_WORKSPACE/target/debug/ashift" --out "$RUNNER_TEMP/pdfium-dist" --unpack-dir "$RUNNER_TEMP/pdfium-pack"
      - name: Exercise OCR with real packs
        if: matrix.slug != 'linux-arm64'
        env:
          ARIAD_REQUIRE_OCR_PACKS: '1'
          ARIAD_TEST_TESSERACT_PACK: ${{ runner.temp }}/tesseract-pack
          ARIAD_TEST_TESSERACT_DIR: ${{ runner.temp }}/tesseract-pack
          ARIAD_TEST_PDFIUM_PACK: ${{ runner.temp }}/pdfium-pack
          ARIAD_TEST_PDFIUM_DIR: ${{ runner.temp }}/pdfium-pack/bin
        run: |
          for filter in engines::tesseract packs::languages packs::install::sweep_tests tools::ocr; do
            cargo test --locked -p ariad-host --features test-probe --lib "$filter"
          done
          cargo test --locked -p ariad-host --features test-probe --test tesseract_adapter --test ocr_pipeline
          cargo test --locked -p ariad-pdfium-engine --test scan_tools --test scan_render
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tesseract-pack-${{ matrix.slug }}
          path: ${{ runner.temp }}/tesseract-pack-dist/*-runtime.tar.zst
          if-no-files-found: error

  manifest:
    needs: source-build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tesseract-pack-*
          path: pack-dist
          merge-multiple: true
      - run: python3 engines/tesseract/pack/fetch-inputs.py "$RUNNER_TEMP/tesseract-input"
      - run: cargo build -p ariad-cli --bin ashift
      - run: bash engines/tesseract/pack/make.sh merge pack-dist "$RUNNER_TEMP/tesseract-input/tessdata" "$GITHUB_WORKSPACE/target/debug/ashift"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tesseract-manifest
          path: |
            pack-dist/pack.toml
            pack-dist/*-tessdata.tar.zst
          if-no-files-found: error

  release:
    needs: manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pack-tesseract-v')
    runs-on: ubuntu-26.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PACK_SIGNING_KEY_ID: ${{ vars.PACK_SIGNING_KEY_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Select the trusted public key
        run: |
          [[ "$PACK_SIGNING_KEY_ID" =~ ^[0-9A-Fa-f]{16}$ ]]
          echo "PUBLIC_KEY=crates/ariad-host/data/pack-keys/${PACK_SIGNING_KEY_ID,,}.pub" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tesseract-pack-*
          path: pack-dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tesseract-manifest
          path: pack-dist
      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.PACK_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.PACK_MINISIGN_KEY_PASSWORD }}
        run: |
          bash scripts/pack/sign-pack.sh --name tesseract --version 0.1.0 --manifest pack-dist/pack.toml --public-key "$PUBLIC_KEY"
      - name: Verify the signed manifest
        run: minisign -V -p "$PUBLIC_KEY" -m pack-dist/pack.toml -x pack-dist/pack.toml.minisig
      - name: Publish the release
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes 'Signed Tesseract engine pack.' pack-dist/pack.toml pack-dist/pack.toml.minisig pack-dist/*.tar.zst
