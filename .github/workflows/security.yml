name: Security

# New RustSec advisories appear without any change here, so dev and main are
# re-checked daily. GitHub emails the owner when a scheduled run fails.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths: [.github/workflows/security.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories (${{ matrix.ref || github.ref_name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs check both long-lived branches; other events check their own ref.
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["dev", "main"]' || '[""]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Install command-line tools
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      - name: Check advisories
        run: just deny-advisories
