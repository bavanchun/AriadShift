name: Cloud E2E

# End-to-end test of the self-hosted compose stack (infra/compose) with the
# core, office and docling profiles: infra/test/e2e/run.sh builds the images,
# starts the stack, converts a scanned PDF to DOCX through /v1 and the docling
# worker, and checks deletion and quota enforcement.
#
# Pushes run on path changes. Pull requests run on the same path changes or
# when they carry the `cloud-e2e` label; the Scope job decides, because a
# `paths` filter would also suppress the label trigger. Scheduled runs check
# out dev.
on:
  schedule:
    # 04:00 UTC daily (11:00 Asia/Saigon).
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - "crates/ariad-server/**"
      - "services/**"
      - "packages/sdk/**"
      - ".env.example"
      - "fixtures/scan/en-alice-p3.pdf"
      - ".github/workflows/cloud-e2e.yml"
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled]

# A new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'cloud-e2e') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=false
          if [[ "$EVENT_NAME" != pull_request ]]; then
            run=true
          elif [[ "$ACTION" == labeled ]]; then
            # Adding any other label must not start a run.
            [[ "$LABEL" == cloud-e2e ]] && run=true
          elif [[ "$HAS_LABEL" == true ]]; then
            run=true
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"
            if grep -Eq '^(infra/|crates/ariad-server/|services/|packages/sdk/|\.env\.example$|fixtures/scan/en-alice-p3\.pdf$|\.github/workflows/cloud-e2e\.yml$)' "$RUNNER_TEMP/changed"; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Cloud E2E runs: $run"

  e2e:
    name: Compose stack (core, office, docling)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-26.04
    # Every image builds from source, including the docling image.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      # The docling image holds LibreOffice, PyTorch and the Docling models; the
      # preinstalled SDKs below are not needed here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # The office and docling workers build LibreOffice's private /tmp in an
      # unprivileged user namespace, which Ubuntu's AppArmor policy restricts.
      - name: Enable unprivileged user namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true

      - name: Show tool versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          curl --version | head -n 1
          jq --version
          unzip -v | head -n 1
          free -h

      - name: Run the end-to-end test
        env:
          E2E_WAIT_TIMEOUT: "900"
          E2E_JOB_TIMEOUT: "900"
        run: bash infra/test/e2e/run.sh
