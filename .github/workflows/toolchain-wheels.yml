name: Docling toolchain wheels

# Builds and publishes Intel-free OpenCV and CPU PyTorch wheels for Linux x86_64,
# builds video-disabled OpenCV on macOS arm64 and verifies ARM torch wheels.
# Windows LLVM OpenMP wheels are deferred to v1.x (#83).
# Tagged runs (`toolchain-wheels-v*`) publish the audited wheels and SHA256SUMS to a
# GitHub Release on this repository so `engines/docling/pack/pins.toml` can pin them by SHA-256.
on:
  workflow_dispatch:
  push:
    tags: ["toolchain-wheels-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Toolchain wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-26.04}
    defaults:
      run:
        shell: python {0}
    env:
      UV_PROJECT_ENVIRONMENT: .tools/torch-build-env
      SCCACHE_DIR: ${{ github.workspace }}/.tools/sccache
      SCCACHE_CACHE_SIZE: 3G
      SCCACHE_IDLE_TIMEOUT: 0
      TARGET: ${{ matrix.target }}
      TORCH_BUILD_CONTAINER: ashift-torch-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Free Linux build space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .

      - name: Install compiler cache
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: sccache@0.19.0,just@1.58.0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Cache source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ariadshift/docling/blobs
          key: docling-blobs-${{ hashFiles('engines/docling/pack/pins.toml', 'engines/docling/pack/torch-build.toml') }}

      - name: Cache OpenCV and LLVM source builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ariadshift/docling/native
          key: docling-native-${{ matrix.target }}-${{ hashFiles('engines/docling/pack/native_build.py', 'engines/docling/pack/vcomp-*.cpp', 'engines/docling/pack/pins.toml', 'uv.lock') }}

      - name: Compute torch source build key
        id: key
        run: |
          import os
          import subprocess
          key = subprocess.check_output([
              "uv", "run", "--no-project", "--python", "3.14", "python",
              "engines/docling/pack/torch_build.py", "key", "--target", os.environ["TARGET"],
          ], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={key}\n")

      - name: Cache audited torch wheels
        id: wheels
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: torch-out
          key: docling-torch-${{ matrix.target }}-${{ steps.key.outputs.value }}

      - name: Restore compiler work
        if: steps.wheels.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .tools/sccache
          key: torch-compiler-${{ matrix.target }}-${{ hashFiles('engines/docling/pack/torch-build.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            torch-compiler-${{ matrix.target }}-${{ hashFiles('engines/docling/pack/torch-build.toml') }}-
            torch-compiler-${{ matrix.target }}-

      - name: Build MKL-free CPU torch
        id: build
        if: steps.wheels.outputs.cache-hit != 'true'
        timeout-minutes: 310
        run: |
          import os
          import subprocess
          tools = ["--package", "ariad-docling", "--group", "torch-build", "--frozen"] if os.name == "nt" else ["--no-project", "--python", "3.14"]
          subprocess.run([
              "uv", "run", *tools, "python", "engines/docling/pack/torch_build.py", "build",
              "--target", os.environ["TARGET"], "--out", "torch-out",
          ], check=True)

      - name: Stop compiler processes before saving their cache
        if: always() && steps.build.outcome != 'skipped'
        run: |
          import os
          import subprocess
          if os.name != "nt":
              name = os.environ["TORCH_BUILD_CONTAINER"]
              found = subprocess.run(["docker", "container", "inspect", name], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if found.returncode == 0:
                  subprocess.run(["docker", "stop", "--time", "30", name], check=True)
          else:
              subprocess.run(["sccache", "--stop-server"], check=False)

      - name: Save compiler work
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .tools/sccache
          key: torch-compiler-${{ matrix.target }}-${{ hashFiles('engines/docling/pack/torch-build.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify cached torch wheel hashes and CPU ABI
        run: |
          import os
          import subprocess
          subprocess.run([
              "uv", "run", "--package", "ariad-docling", "--group", "torch-build", "--frozen",
              "python", "engines/docling/pack/torch_build.py", "verify",
              "--target", os.environ["TARGET"], "--out", "torch-out",
          ], check=True)

      - name: Save verified torch wheels by source hash
        if: steps.wheels.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: torch-out
          key: docling-torch-${{ matrix.target }}-${{ steps.key.outputs.value }}

      - name: Build IPP-free OpenCV wheel, collate toolchain artifacts and audit wheels
        run: |
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("engines/docling/pack").resolve()))
          import fetch
          import licenses
          import native_build

          target = os.environ["TARGET"]
          pins = dict(fetch.load_pins())
          pins.pop("toolchain", None)
          cache = fetch.default_cache()
          opencv_wheel = native_build.opencv(target, pins, cache)
          subprocess.run([
              "uv", "pip", "install", "--python", sys.executable,
              "--no-deps", "--reinstall", str(opencv_wheel),
          ], check=True)
          native_build.verify_opencv(sys.executable, target=target)

          out = Path("wheels-out")
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          native_build.export_opencv(opencv_wheel, target, pins, out)

          torch_out = Path("torch-out")
          torch_record = json.loads((torch_out / "build.json").read_text(encoding="utf-8"))
          torch_files = {}
          for name, meta in sorted(torch_record["files"].items()):
              source = torch_out / name
              asset = (
                  f"OpenBLAS-LICENSE-{target}.txt"
                  if name == "OpenBLAS-LICENSE.txt"
                  else name
              )
              shutil.copyfile(source, out / asset)
              torch_files[name] = {
                  "asset": asset,
                  "sha256": meta["sha256"],
                  "size": meta["size"],
              }
          torch_record["kind"] = "torch"
          torch_record["files"] = torch_files
          (out / f"torch-build-{target}.json").write_text(
              json.dumps(torch_record, indent=2) + "\n", encoding="utf-8"
          )

          wheels = sorted(out.glob("*.whl"))
          openmp = out / "libiomp5md.dll" if target.endswith("windows-msvc") else None
          licenses.check_wheel_files(wheels, allow_itt=False, openmp_dll=openmp)

      - name: Upload toolchain wheels and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-wheels-${{ matrix.target }}
          path: wheels-out/*
          if-no-files-found: error
          retention-days: 30

  arm:
    name: Verify ARM wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-26.04-arm}
          - {target: aarch64-apple-darwin, os: macos-26}
    env:
      UV_PROJECT_ENVIRONMENT: .tools/torch-arm-env
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Audit locked ARM wheels and verify native CPU ABI
        shell: bash
        run: >-
          uv run --package ariad-docling --frozen python
          engines/docling/pack/torch_build.py verify-upstream --target "$TARGET"

  opencv-macos:
    name: Video-disabled OpenCV (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-opencv-macos
      cancel-in-progress: false
    defaults:
      run:
        shell: python {0}
    env:
      UV_PROJECT_ENVIRONMENT: .tools/opencv-macos-env
      TARGET: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Cache verified sources and native build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cache/ariadshift/docling/blobs
            ~/.cache/ariadshift/docling/native
          key: docling-opencv-macos-${{ hashFiles('engines/docling/pack/native_build.py', 'engines/docling/pack/pins.toml', 'uv.lock') }}

      - name: Build, probe and audit video-disabled OpenCV
        run: |
          import os
          import subprocess
          subprocess.run([
              "uv", "run", "--package", "ariad-docling", "--group", "pack-build",
              "--frozen", "python", "-c", """
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('engines/docling/pack').resolve()))
          import fetch
          import licenses
          import native_build
          target = os.environ['TARGET']
          pins = dict(fetch.load_pins())
          pins.pop('toolchain', None)
          wheel = native_build.opencv(target, pins, fetch.default_cache())
          subprocess.run([
              'uv', 'pip', 'install', '--python', sys.executable,
              '--no-deps', '--reinstall', str(wheel),
          ], check=True)
          native_build.verify_opencv(sys.executable, target=target)
          licenses.check_wheel_files([wheel], allow_itt=False)
          out = Path('wheels-out')
          shutil.rmtree(out, ignore_errors=True)
          native_build.export_opencv(wheel, target, pins, out)
          """], check=True)

      - name: Upload audited OpenCV wheel and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-wheels-aarch64-apple-darwin
          path: wheels-out/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: Collate SHA256SUMS and pin manifest
    needs: [build, arm, opencv-macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Download per-target toolchain wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-wheels-*
          path: release-out
          merge-multiple: true

      - name: Write SHA256SUMS and render pins.toml snippet
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="toolchain-wheels-v0.2.0"
          if [[ "$REF_NAME" == toolchain-wheels-v* ]]; then
            tag="$REF_NAME"
          fi
          uv run --no-project --python 3.14 python engines/docling/pack/licenses.py \
            --render-toolchain-pins release-out --release-tag "$tag" \
            > release-out/toolchain-pins.toml
          (
            cd release-out
            sha256sum ./*.whl ./*.json ./*.txt ./*.dll ./toolchain-pins.toml 2>/dev/null || true
          ) | LC_ALL=C sort -k 2 > release-out/SHA256SUMS
          (cd release-out && sha256sum --check SHA256SUMS)
          cat release-out/SHA256SUMS
          cat release-out/toolchain-pins.toml

      - name: Upload collated release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-wheels-release
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/toolchain-wheels-v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download collated release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-wheels-release
          path: release-out

      - name: Verify checksums and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd release-out && sha256sum --check SHA256SUMS)
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" \
              --title "$TAG" \
              --notes "Audited Intel-free Linux x86_64 CPU PyTorch/OpenCV and video-disabled macOS arm64 OpenCV wheels, with SHA256SUMS; ARM torch wheels verified. Windows LLVM OpenMP wheels are deferred to v1.x (#83)."
          fi
          gh release upload "$TAG" release-out/* --repo "$GH_REPO" --clobber
