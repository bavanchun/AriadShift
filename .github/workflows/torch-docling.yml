name: Docling torch toolchain

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - engines/docling/pack/torch_build.py
      - engines/docling/pack/torch-build.toml
      - engines/docling/pack/native_build.py
      - engines/docling/pack/vcomp-*.cpp
      - engines/docling/pack/pins.toml
      - engines/docling/pyproject.toml
      - uv.lock
      - .github/workflows/torch-docling.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: CPU torch (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-26.04}
          - {target: x86_64-pc-windows-msvc, os: windows-2025}
    defaults:
      run:
        shell: bash
    env:
      UV_PROJECT_ENVIRONMENT: .tools/torch-build-env
      SCCACHE_DIR: ${{ github.workspace }}/.tools/sccache
      SCCACHE_CACHE_SIZE: 3G
      SCCACHE_IDLE_TIMEOUT: 0
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.23
          python-version: "3.14"

      - name: Free Linux build space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .

      - name: Install compiler cache
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: sccache@0.19.0,just@1.58.0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Compute source build key
        id: key
        run: |
          key=$(uv run --no-project --python 3.14 python engines/docling/pack/torch_build.py key --target "$TARGET")
          echo "value=$key" >> "$GITHUB_OUTPUT"

      # Cache namespaces include source, options, target and frozen build tools.
      # Output files are rehashed and imported before a restored wheel is used.
      - name: Cache audited wheels
        id: wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: torch-out
          key: docling-torch-${{ matrix.target }}-${{ steps.key.outputs.value }}

      - name: Restore compiler work
        if: steps.wheels.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .tools/sccache
          key: torch-compiler-${{ matrix.target }}-${{ steps.key.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: torch-compiler-${{ matrix.target }}-${{ steps.key.outputs.value }}-

      - name: Build MKL-free CPU torch
        id: build
        if: steps.wheels.outputs.cache-hit != 'true'
        timeout-minutes: 310
        run: just docling-torch-build "$TARGET" torch-out

      # Preserve completed compilation even when the bounded build step fails.
      # A rerun can resume through sccache without exceeding the hosted job limit.
      - name: Save compiler work
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: .tools/sccache
          key: torch-compiler-${{ matrix.target }}-${{ steps.key.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify cached wheel hashes and CPU ABI
        if: steps.wheels.outputs.cache-hit == 'true'
        run: >-
          uv run --package ariad-docling --group torch-build --frozen python
          engines/docling/pack/torch_build.py verify --target "$TARGET" --out torch-out

      - name: Upload wheels, checksums and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docling-torch-${{ matrix.target }}
          path: torch-out/*
          if-no-files-found: error
          retention-days: 30
