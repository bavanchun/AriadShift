[package]
name = "ariad-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
ariad-core = { path = "../crates/ariad-core", default-features = false }
ariad-host = { path = "../crates/ariad-host", default-features = false }
libfuzzer-sys = "0.4.13"
saphyr-parser = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth", "float_roundtrip"] }
unicode-normalization = "0.1.25"
typst = { version = "0.15.1", optional = true }

[features]
pdf-reader = ["ariad-core/pdf"]
typst-writer = ["ariad-host/typst", "dep:typst"]

[lib]
name = "ariad_fuzz"
path = "src/lib.rs"

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "markdown_reader"
path = "fuzz_targets/markdown_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "front_matter"
path = "fuzz_targets/front_matter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_reader"
path = "fuzz_targets/html_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pandoc_ast_to_ir"
path = "fuzz_targets/pandoc_ast_to_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ir_json"
path = "fuzz_targets/ir_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "limits_validate"
path = "fuzz_targets/limits_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docling_to_ir"
path = "fuzz_targets/docling_to_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_reader"
required-features = ["pdf-reader"]
path = "fuzz_targets/pdf_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typst_writer"
required-features = ["typst-writer"]
path = "fuzz_targets/typst_writer.rs"
test = false
doc = false
bench = false
