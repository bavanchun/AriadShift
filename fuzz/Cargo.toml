[package]
name = "ariad-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
ariad-core = { path = "../crates/ariad-core", default-features = false }
ariad-host = { path = "../crates/ariad-host", default-features = false }
ariad-pdf = { path = "../crates/ariad-pdf", optional = true }
libfuzzer-sys = "0.4.13"
saphyr-parser = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth", "float_roundtrip"] }
unicode-normalization = "0.1.25"
typst = { version = "0.15.1", optional = true }
zip = { version = "9.0.5", default-features = false }

[features]
pdf-reader = ["ariad-core/pdf", "dep:ariad-pdf"]
typst-writer = ["ariad-host/typst", "dep:typst"]

[lib]
name = "ariad_fuzz"
path = "src/lib.rs"

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "markdown_reader"
path = "fuzz_targets/markdown_reader.rs"
test = false
doc = false
bench = false

