# cargo-about configuration for AriadShift
# Governed by licensing rules in AGENTS.md and deny.toml

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Exclude dev-dependencies from distributed binary license inventory
ignore-dev-dependencies = true

targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Transitive dependencies of ammonia (HTML sanitizer)
[cssparser]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

# Transitive dependency of directories (engine pack data directory)
[option-ext]
accepted = ["MPL-2.0"]

# compile-time only (proc-macro dependency of const-random-macro); not present in distributed binaries
[tiny-keccak]
accepted = ["CC0-1.0"]

# Unmodified Tauri HTML processing dependencies.
[selectors]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

# Typst's roman-numeral helper (0BSD OR CC0-1.0)
[roman-numerals-rs]
accepted = ["0BSD"]
